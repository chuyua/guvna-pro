name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  binary:
    runs-on: ubuntu-latest
    outputs:
      release_kind: ${{ steps.classify.outputs.kind }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag publication policy
        id: classify
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          kind="$(bash .github/scripts/release-policy.sh "$VERSION")"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race ./...

      - name: Build Linux amd64 binary
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags="-s -w -X main.version=${VERSION}" -o dist/guvna ./cmd/guvna

      - name: Verify binary and checksum
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          ./dist/guvna --help
          ./dist/guvna serve --help
          test "$(./dist/guvna --version)" = "guvna ${VERSION}"
          cd dist
          sha256sum guvna > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Publish binary release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
          RELEASE_KIND: ${{ steps.classify.outputs.kind }}
        run: |
          if [[ "$RELEASE_KIND" == "prerelease" ]]; then
            gh release create "$VERSION" dist/guvna dist/SHA256SUMS \
              --verify-tag --generate-notes --title "$VERSION" \
              --prerelease --latest=false
          else
            gh release create "$VERSION" dist/guvna dist/SHA256SUMS \
              --verify-tag --generate-notes --title "$VERSION"
          fi

  image:
    needs: binary
    if: ${{ needs.binary.outputs.release_kind == 'stable' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
