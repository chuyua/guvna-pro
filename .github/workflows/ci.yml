name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify release tag safety (no publish)
        run: bash .github/scripts/test-release-policy.sh

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l . )" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...

      - name: Build and smoke test single binary
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-X main.version=ci" -o "$RUNNER_TEMP/guvna" ./cmd/guvna
          "$RUNNER_TEMP/guvna" --help
          "$RUNNER_TEMP/guvna" serve --help
          test "$("$RUNNER_TEMP/guvna" --version)" = "guvna ci"
